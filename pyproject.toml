[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "acoustics"
version = "0.3.0"
authors = [
    { name = "Python Acoustics contributors" },
]
maintainers = [
    { name = "Adrian Stepien" },
]
description = "Acoustics module for Python."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy >= 2.0, < 3.0",
    "scipy >= 1.15, < 2.0",
    "matplotlib >= 3.8",
    "pandas >= 2.2",
    "tabulate >= 0.10",
    "soundfile >= 0.13.1",
]
[project.optional-dependencies]
fast_fft = [
    "pyFFTW >= 0.15"
]
[project.license]
file = "LICENSE"
[project.urls]
"Homepage" = "https://github.com/adrian-stepien/python-acoustics"
"Bug Tracker" = "https://github.com/adrian-stepien/python-acoustics/issues"
"Repository" = "https://github.com/adrian-stepien/python-acoustics"

[dependency-groups]
test = [
    "pytest >= 8.0",
    "pytest-cov >= 5.0",
]
lint = [
    "ruff >= 0.4",
]
docs = [
    "sphinx >= 8.0",
]
build = [
    "build >= 1.2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "build" },
]

[tool.flit.sdist]
include = ["tests/"]

[tool.pytest.ini_options]
norecursedirs = [
    "build",
    ".eggs",
    ".tox",
    ".venv",
    ".claude",
]
addopts = [
    "--cov=acoustics",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["acoustics"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "*.ipynb",
    "docs/_build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — formatter handles length
    "E741",  # ambiguous variable names (l, I) — acoustics uses these for physics symbols
    "B008",  # function call in default argument — used for REFERENCE_* module constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "F403",  # star imports are idiomatic in these tests
    "F405",  # names may come from star imports
    "F821",  # star imports mask undefined-name detection
    "F841",  # unused locals in test scratchpads
    "B018",  # useless expression — tests sometimes evaluate for side effects
    "E721",  # type() == comparisons are intentional in type tests
]
"acoustics/__init__.py" = ["F401"]            # re-exports for the public API
"acoustics/standards/__init__.py" = ["F401"]  # re-exports submodules
"acoustics/atmosphere.py" = ["F403", "F405"]  # re-exports ISO 9613-1 symbols

[tool.ruff.format]
quote-style = "preserve"
