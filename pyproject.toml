[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "acoustics"
version = "0.3.0"
authors = [
    { name = "Python Acoustics contributors" },
]
maintainers = [
    { name = "Adrian Stepien" },
]
description = "Acoustics module for Python."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy >= 1.22, < 2.4",
    "scipy >= 1.8, < 1.16",
    "matplotlib >= 3.5",
    "pandas >= 1.4",
    "tabulate >= 0.9",
    "soundfile >= 0.12.1",
]
[project.optional-dependencies]
fast_fft = [
    "pyFFTW >= 0.13"
]
[project.license]
file = "LICENSE"
[project.urls]
"Homepage" = "https://github.com/adrian-stepien/python-acoustics"
"Bug Tracker" = "https://github.com/adrian-stepien/python-acoustics/issues"
"Repository" = "https://github.com/adrian-stepien/python-acoustics"

[dependency-groups]
test = [
    "pytest >= 8.0",
]
lint = [
    "ruff >= 0.4",
]
docs = [
    "sphinx >= 8.0",
]
build = [
    "build >= 1.2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "build" },
]

[tool.flit.sdist]
include = ["tests/"]

[tool.pytest.ini_options]
norecursedirs = [
    "build",
    ".eggs",
    ".tox",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "*.ipynb",
    "docs/_build",
]

[tool.ruff.lint]
select = [
    "E9",
]

[tool.ruff.format]
quote-style = "preserve"
